<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Job & Knock">
  <title>Job & Knock</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#07101f}
    #splash{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#09275f 0%,#07101f 72%);transition:opacity .22s ease}
    #splash.done{opacity:0;pointer-events:none}
    .splash-inner{width:min(82vw,360px);text-align:center;color:white;padding:28px}
    .logo{width:118px;height:118px;border-radius:25%;display:block;margin:0 auto 18px;box-shadow:0 18px 50px rgba(0,0,0,.34)}
    h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
    p{margin:0;color:#b9c9e6;font-size:14px;line-height:1.45}
    .spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,.22);border-top-color:#30d8ff;border-radius:50%;margin:22px auto 0;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    #slow{display:none;margin-top:24px}
    #slow.show{display:block}
    .direct{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:11px;background:#fff;color:#0a2452;text-decoration:none;font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbwrrtB4EflChLQNzw1GNAOfDii_eBHTHEakz0NidD3eKgZaXXgZRx63RJ1azz8YucjtEQ/exec?embed=1"
    title="Job & Knock"
    allow="clipboard-read; clipboard-write; fullscreen"
    allowfullscreen></iframe>

  <div id="splash">
    <div class="splash-inner">
      <img class="logo" src="./icons/icon-180.png" alt="">
      <h1>Job & Knock</h1>
      <p id="status">Opening your invoice workspace…</p>
      <div class="spinner" id="spinner"></div>
      <div id="slow">
        <p>The Google app is taking longer than expected.</p>
        <a class="direct" href="https://script.google.com/macros/s/AKfycbwrrtB4EflChLQNzw1GNAOfDii_eBHTHEakz0NidD3eKgZaXXgZRx63RJ1azz8YucjtEQ/exec">Open directly</a>
      </div>
    </div>
  </div>

  <script>
    const frame=document.getElementById('app');
    const splash=document.getElementById('splash');
    const slow=document.getElementById('slow');

    let loaded=false;
    frame.addEventListener('load',()=>{
      loaded=true;
      setTimeout(()=>splash.classList.add('done'),260);
    });

    setTimeout(()=>{
      if(!loaded) slow.classList.add('show');
    },12000);

    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
